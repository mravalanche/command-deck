services:
  command-deck:
    image: ghcr.io/mravalanche/command-deck:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yml:/app/config.yaml:ro
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
